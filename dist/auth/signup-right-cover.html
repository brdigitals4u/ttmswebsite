<body class="auth auth-signup-right-cover">

<!--start:auth-->
<section id="auth" class="auth d-flex">
    <div class="auth-left w-100p xl-w-45p">
        <div class="logo top-0 mt-40 mb-100">
            <a href="#">
                <span class="ttms-brand ttms-brand-dark">TTMS</span>
            </a>
        </div>
        <div class="content">
            <div class="heading text-center">
                <h2 class="text-hkgrotesk font-bold text-alt text-black mb-36">Let’s join us</h2>
            </div>
            <a href="#" class="btn btn-primary btn-block d-flex justify-center items-center mb-32">
                <div class="bg-white h-40 w-40 d-flex justify-center items-center rounded-4 absolute -ml-156">
                    <img src="../assets/images/clients-logo/icons/google@2x.png" class="h-24">
                </div>
                <span class="text">Sign in with Google</span></a>
            <div class="desc mb-32 text-center">
                <span class="text-16 font-semibold text-black">Or, sign in with your email</span>
                <div class="hr"></div>
            </div>
            <form action="">
                <div class="form-group">
                    <label>Your name*</label>
                    <input type="text" class="form-control" placeholder="Your name">
                </div>
                <div class="form-group">
                    <label>Email address*</label>
                    <input type="email" class="form-control" placeholder="Enter your email">
                </div>
                <div class="form-group">
                    <label>Password*</label>
                    <input type="password" class="form-control" placeholder="Enter your password">
                </div>
                <div class="form-row mb-32">
                    <div class="col">
                        <div class="form-group form-check keep-signin mb-0">
                            <input type="checkbox" class="form-check-input" id="agreement">
                            <label class="form-check-label font-semibold text-14 text-gray" for="agreement">Agree to terms & conditions</label>
                        </div>
                    </div>
                </div>
                <div class="form-group mb-24">
                    <a href="#" class="btn btn-primary btn-block">Sign up</a>
                </div>
                <div class="form-group">
                    <span class="signup font-semibold text-14 leading-24 text-gray">Already have an account? <a href="#" class="font-bold text-primary">Sign in now</a></span>
                </div>
            </form>
        </div>
    </div>
    <div class="auth-right w-100p xl-w-55p d-flex justify-center items-center">
        <img src="../assets/images/covers/cover-12.svg" alt="" class="bg-cover w-100">
        <div class="content absolute">
            <div id="shape-1">
                <img src="../assets/images/illustrations/shape-1.svg" alt="">
            </div>
            <div>
                <i class="fas fa-quote-left text-40 text-info"></i>
                <h3 class="text-hkgrotesk font-normal leading-56 tracking-02 text-white mt-28 mb-24">This platform is one of the best companies I have dealt with in Indonesia. They’re always happy to help, and i wouldn’t hesitate to recommend them.</h3>
                <div class="d-flex items-center">
                    <p class="font-semibold text-20 leading-24 text-white mr-16">Daniel Anderson</p>
                    <p class="italic text-info"><img src="../assets/images/icons/ic-checklist-blue.svg" alt="" class="mr-8"> Verified customer</p>
                </div>
            </div>
            <div id="shape-2">
                <img src="../assets/images/illustrations/shape-2.svg" alt="">
            </div>
            <div id="shape-3">
                <img src="../assets/images/illustrations/shape-3.svg" alt="">
            </div>
        </div>
    </div>
</section>
<!--end:auth-->
