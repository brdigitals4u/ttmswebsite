# One-time: copy this to the server so Nginx serves TTMS on port 8456.
# System nginx:  scp to /etc/nginx/conf.d/ttms-8456.conf
# Standalone:    scp to /etc/nginx/ttms-8456-server.conf (see ttms-8456-standalone.conf)
# Then ensure /etc/nginx/snippets/ttms-legacy-redirects.conf exists (deploy script updates it).
# Reload: nginx -t && systemctl reload nginx  (or systemctl reload ttms-8456 if using standalone)

server {
  listen 8456;
  server_name _;
  root /var/www/ttms;
  index index.html;

  # Serve / without internal redirect to /index.html (avoids redirect loop with legacy /index.html → /).
  location = / {
    try_files /index.html =404;
  }

  include /etc/nginx/snippets/ttms-legacy-redirects.conf;

  location = /apps/desktop/ { return 308 /; }
  location = /apps/desktop { return 308 /; }
  # This build does not generate /services/ index as desired; redirect it to a concrete service page.
  location = /services { return 301 /services/dispatch-management/; }
  location = /services/ { return 301 /services/dispatch-management/; }

  # This build does not generate /blog/ index.html; avoid 403 on the directory.
  location = /blog { return 301 /blog/blog-detail/; }
  location = /blog/ { return 301 /blog/blog-detail/; }

  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  # Long-term cache for hashed and static assets (fonts, images, css, js).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|svg|webp|avif|ico|woff2|woff|ttf|eot|mp4)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ~* \.html$ {
    add_header Cache-Control "public, max-age=300, must-revalidate" always;
    try_files $uri =404;
  }

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    image/svg+xml;
}
