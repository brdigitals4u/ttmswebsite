# Standalone Nginx that only listens on 8456 (no port 80).
# Use when port 80 is already in use (e.g. Nginx Proxy Manager).
#
# On server: copy ttms-8456.server.conf to /etc/nginx/ttms-8456-server.conf, then:
#   scp deploy/nginx/ttms-8456-standalone.conf root@31.97.9.33:/etc/nginx/ttms-8456-standalone.conf
#   ssh root@31.97.9.33 'nginx -c /etc/nginx/ttms-8456-standalone.conf'
# Or run via systemd (see deploy/ftp/README.md). Use deploy/setup-nginx.sh --standalone to automate.

pid /run/nginx-ttms-8456.pid;
events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  include /etc/nginx/ttms-8456-server.conf;
}
